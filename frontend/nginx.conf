server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Explicitly serve robots.txt and sitemap.xml
    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        try_files $uri =404;
    }

    # Handle SPA routing - fallback to index.html
    location / {
        # SEO: Detect bots and proxy to Backend for dynamic Meta tags
        if ($http_user_agent ~* "facebookexternalhit|twitterbot|linkedinbot|discordbot|whatsapp|zalo") {
             # Rewrite path and proxy to backend to generate SEO meta tags
             rewrite ^(.*)$ /api/public/seo-meta?path=$1 break;
             proxy_pass ${BACKEND_URL};
        }
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend (optional, if on same domain or needed)
    # Since backend is likely separate on Railway, we usually use absolute URLs or another proxy.
    # But if the user wants relative paths /api to work, we need a proxy pass.
    # For now, we assume VITE_API_URL is set in frontend to point to backend.
    
    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
