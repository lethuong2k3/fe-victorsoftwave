server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Explicitly serve robots.txt and sitemap.xml
    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        rewrite ^ /api/sitemap.xml last;
    }

    # Handle SPA routing - fallback to index.html
    location / {
        # SEO: Detect bots and proxy to Backend for dynamic Meta tags
        if ($http_user_agent ~* "facebookexternalhit|twitterbot|linkedinbot|discordbot|whatsapp|zalo") {
             # Rewrite path and proxy to backend to generate SEO meta tags
             rewrite ^(.*)$ /api/public/seo-meta?path=$1 break;
             proxy_pass ${BACKEND_URL};
        }
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
